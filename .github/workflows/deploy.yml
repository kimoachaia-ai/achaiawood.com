name: Deploy Pre-rendered Site
on:
  push:
    branches: ["main"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install default dependencies
        run: npm install
        
      - name: Install SEO plugins on the fly
        run: npm install -D vite-plugin-sitemap @types/node
        
      - name: Auto-generate SEO files
        run: |
          mkdir -p public
          echo "User-agent: *" > public/robots.txt
          echo "Allow: /" >> public/robots.txt
          echo "Sitemap: https://achaiawood.com/sitemap.xml" >> public/robots.txt
          echo "achaiawood.com" > public/CNAME
          
      - name: Build site (includes pre-rendering)
        run: npm run build
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
